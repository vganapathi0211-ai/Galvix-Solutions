server.port=${SERVER_PORT:8080}

spring.application.name=gl-solutions-backend

app.storage.excel-file-path=${EXCEL_FILE_PATH:./data/GL_Solutions_Leads.xlsx}
app.ai.base-url=${AI_BASE_URL:http://localhost:8000}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID:}
app.whatsapp.recipient-number=${WHATSAPP_RECIPIENT_NUMBER:}
app.whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:gl_solutions_new_enquiry}

spring.jackson.default-property-inclusion=non_null

spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}

management.endpoints.web.exposure.include=health,info
